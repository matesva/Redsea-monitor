name: 24h AI Update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-genai

      - name: Fetch and Analyze (Red Sea)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python fetch_news.py

      - name: Fetch and Analyze (USA)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          NTFY_TOPIC_USA: ${{ secrets.NTFY_TOPIC_USA }}
        run: |
          mkdir -p usa
          python fetch_usa.py

      - name: Fetch and Analyze (Europe)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          NTFY_TOPIC_EUROPE: ${{ secrets.NTFY_TOPIC_EUROPE }}
        run: |
          mkdir -p europe
          python fetch_europe.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json rss.xml usa/data.json usa/rss.xml europe/data.json europe/rss.xml
          git commit -m "Auto-update AI Monitors (Red Sea + USA + Europe)" || exit 0
          git push

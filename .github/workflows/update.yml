name: 24h AI Update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Replace outdated model in script
        run: |
          sed -i 's/gemini-2.5-flash/gemini-2.0-flash/g' fetch_news.py
          sed -i 's/gemini-3.6-flash/gemini-2.0-flash/g' fetch_news.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-genai

      - name: Fetch and Analyze
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_news.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git commit -m "Auto-update AI Red Sea Monitor" || exit 0
          git push

name: Doporučení za graf

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Přesun sekce doporučení
        run: python3 reorder_recs.py

      - name: Commit
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Investiční doporučení za grafem"
            git pull --rebase origin main && git push
          fi

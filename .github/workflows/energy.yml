name: Energy flows
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: energy
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout toky
        run: |
          D=$(date -u +%F)
          Y=$(date -u -d yesterday +%F)
          B="https://api.energy-charts.info/cbpf?country=cz"
          UA='Mozilla/5.0 (compatible; Redsea-monitor)'
          OK=0
          for U in "$B&start=$Y&end=$D" "$B&start=$D" "$B"; do
            echo "Zkouším: $U"
            CODE=$(curl -sSL -A "$UA" -H 'Accept: application/json' -w "%{http_code}" "$U" -o energy.json || true)
            echo "HTTP $CODE"
            if [ "$CODE" = "200" ] && python3 -c "import json;d=json.load(open('energy.json'));assert d['countries']"; then
              OK=1; break
            fi
            sleep 3
          done
          [ "$OK" = "1" ] || { echo "Stažení se nepodařilo"; exit 1; }
      - name: Publikovat na větev data (bez historie)
        run: |
          mkdir out && cp energy.json out/ && cd out
          git init -q -b data
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add energy.json
          git commit -qm "energy"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

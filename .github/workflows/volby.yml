name: Volby – ČSÚ data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: volby-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main (skript)
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout repozitáře pro větev data
        uses: actions/checkout@v4
        with:
          path: data
          fetch-depth: 0

      - name: Přepnout na větev data (vytvoří se, pokud neexistuje)
        working-directory: data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git checkout data
          else
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Stáhnout výsledky z ČSÚ
        run: python3 main/scripts/volby_update.py data --debug

      - name: Zvolení zastupitelé (registr kandidátů)
        continue-on-error: true
        run: python3 main/scripts/zastupitele.py data

      - name: Senát (1. a 2. kolo)
        continue-on-error: true
        run: python3 main/scripts/senat_update.py data --debug

      - name: Commit, pokud se něco změnilo
        working-directory: data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Beze změny"
          else
            git commit -m "volby: aktualizace $(date -u +%H:%M)"
            git push origin data
          fi

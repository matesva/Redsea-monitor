name: Přidat navigaci

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vložit odkaz na nav.js do stránek
        run: python3 add_nav.py

      - name: Commit
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Přidána sdílená navigace"
            git pull --rebase origin main && git push
          fi

<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Sea & Investment AI Monitor</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #38bdf8; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 0.9em; margin-bottom: 25px; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.9em; }
        .bg-KRITICKÁ { background: #ef4444; color: white; }
        .bg-VYSOKÁ { background: #f97316; color: white; }
        .bg-STŘEDNÍ { background: #eab308; color: black; }
        .bg-STABILNÍ { background: #22c55e; color: white; }
        .action { font-weight: bold; padding: 2px 8px; border-radius: 4px; }
        .action-KOUPIT { background: #166534; color: #4ade80; }
        .action-PRODAT { background: #991b1b; color: #fca5a5; }
        .action-DRŽET { background: #854d0e; color: #fef08a; }
        .rec-item { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #334155; }
        .rec-item:last-child { border-bottom: none; }
        .news-item { margin-bottom: 10px; }
        .news-item a { color: #38bdf8; text-decoration: none; font-weight: 500; }
        .news-item a:hover { text-decoration: underline; }
        .news-date { font-size: 0.8em; color: #64748b; margin-left: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rudé moře: AI Monitor & Geopolitika</h1>
        <div class="subtitle">Poslední aktualizace: <span id="updated">Načítání...</span></div>

        <div class="card">
            <h2>Aktuální Úroveň Hrozby: <span id="threat-level" class="badge">--</span></h2>
            <p id="security-status" style="line-height: 1.6; color: #cbd5e1;">Načítání AI analýzy...</p>
        </div>

        <div class="card">
            <h2>Investiční Doporučení (AI Portfoliový Manažer)</h2>
            <div id="recommendations">Načítání doporučení...</div>
        </div>

        <div class="card">
            <h2>Předpověď Vývoje</h2>
            <p id="forecast" style="line-height: 1.6; color: #cbd5e1;">Načítání předpovědi...</p>
        </div>

        <div class="card">
            <h2>Monitoring Zpráv (Posledních 24h)</h2>
            <div id="articles">Načítání zpráv...</div>
        </div>
    </div>

    <script>
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('updated').innerText = data.last_updated || 'N/A';
                
                const threat = data.assessment.threat_level || 'NEZNÁMÁ';
                const threatElem = document.getElementById('threat-level');
                threatElem.innerText = threat;
                threatElem.className = 'badge bg-' + threat.split(' ')[0];

                document.getElementById('security-status').innerText = data.assessment.security_status || '';
                document.getElementById('forecast').innerText = data.assessment.forecast || '';

                const recsContainer = document.getElementById('recommendations');
                recsContainer.innerHTML = '';
                if (data.assessment.recommendations) {
                    data.assessment.recommendations.forEach(r => {
                        recsContainer.innerHTML += `
                            <div class="rec-item">
                                <span class="action action-${r.action}">${r.action}</span> 
                                <strong>${r.sector}</strong>
                                <p style="margin: 5px 0 0 0; color: #94a3b8; font-size: 0.9em;">${r.reason}</p>
                            </div>
                        `;
                    });
                }

                const articlesContainer = document.getElementById('articles');
                articlesContainer.innerHTML = '';
                if (data.articles && data.articles.length > 0) {
                    data.articles.forEach(a => {
                        articlesContainer.innerHTML += `
                            <div class="news-item">
                                <a href="${a.link}" target="_blank">${a.title}</a>
                                <span class="news-date">[${a.source} - ${a.published}]</span>
                            </div>
                        `;
                    });
                } else {
                    articlesContainer.innerText = 'Žádné relevantní zprávy za posledních 24 hodin.';
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('security-status').innerText = 'Data se ještě vygenerují při prvním úspěšném spuštění Actions.';
            });
    </script>
</body>
</html>

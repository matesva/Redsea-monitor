<script>
    fetch('data.json?v=' + new Date().getTime(), { cache: 'no-store' })
        .then(res => res.json())
        .then(data => {
            // 1. Aktualizace času
            document.getElementById('updated').innerText = data.last_updated || 'N/A';

            // 2. Úroveň hrozby
            const rawThreat = (data.assessment && data.assessment.threat_level) ? data.assessment.threat_level : 'STABILNÍ';
            const cleanThreat = rawThreat.split(' ')[0].split('/')[0].trim().toUpperCase();
            
            const threatElem = document.getElementById('threat-level');
            threatElem.innerText = cleanThreat;
            threatElem.className = 'badge bg-' + cleanThreat;

            // 3. Bezpečnostní status (Ošetření opomenutého klíče)
            const secElem = document.getElementById('security-status');
            if (data.assessment && data.assessment.security_status) {
                secElem.innerText = data.assessment.security_status;
            } else {
                secElem.innerText = ''; // Pokud klíč chybí, nechá odstavec prázdný a neshodí aplikaci
            }

            // 4. Předpověď vývoje
            document.getElementById('forecast').innerText = (data.assessment && data.assessment.forecast) || 'Předpověď není k dispozici.';

            // 5. Investiční doporučení
            const recsContainer = document.getElementById('recommendations');
            recsContainer.innerHTML = '';
            if (data.assessment && data.assessment.recommendations && data.assessment.recommendations.length > 0) {
                data.assessment.recommendations.forEach(r => {
                    const cleanAction = (r.action || 'DRŽET').trim().toUpperCase();
                    recsContainer.innerHTML += `
                        <div class="rec-item">
                            <span class="action action-${cleanAction}">${cleanAction}</span> 
                            <strong>${r.sector}</strong>
                            <p style="margin: 5px 0 0 0; color: #94a3b8; font-size: 0.9em;">${r.reason}</p>
                        </div>
                    `;
                });
            } else {
                recsContainer.innerText = 'Žádná doporučení.';
            }

            // 6. Graf
            if (data.history && data.history.length > 0) {
                const ctx = document.getElementById('threatChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.history.map(h => h.date),
                        datasets: [{
                            label: 'Úroveň hrozby',
                            data: data.history.map(h => h.value || 1),
                            borderColor: '#38bdf8',
                            backgroundColor: 'rgba(56,189,248,0.15)',
                            tension: 0.3,
                            fill: true,
                            pointRadius: 3
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                min: 0.5, max: 4.5,
                                ticks: {
                                    stepSize: 1,
                                    color: '#94a3b8',
                                    callback: v => ({1:'STABILNÍ', 2:'STŘEDNÍ', 3:'VYSOKÁ', 4:'KRITICKÁ'}[v] || '')
                                },
                                grid: { color: '#334155' }
                            },
                            x: { ticks: { color: '#64748b', maxRotation: 45 }, grid: { color: '#334155' } }
                        },
                        plugins: { legend: { labels: { color: '#f8fafc' } } }
                    }
                });
            }

            // 7. Zprávy (Monitoring)
            const articlesContainer = document.getElementById('articles');
            articlesContainer.innerHTML = '';
            if (data.articles && data.articles.length > 0) {
                data.articles.forEach(a => {
                    const source = a.source || 'Zpravodajství';
                    const published = a.published || '';
                    articlesContainer.innerHTML += `
                        <div class="news-item">
                            <a href="${a.link}" target="_blank" rel="noopener">${a.title}</a>
                            <span class="news-meta">[${source} • ${published}]</span>
                        </div>
                    `;
                });
            } else {
                articlesContainer.innerText = 'Žádné zprávy za posledních 24h.';
            }
        })
        .catch(err => {
            console.error(err);
        });
</script>

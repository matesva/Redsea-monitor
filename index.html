<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rudé moře: bezpečnost & geopolitika</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Úvodní Banner s obrázkem -->
    <header class="hero-banner">
        <img src="https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=1200&q=80" alt="Rudé moře" class="hero-img">
        <div class="hero-overlay">
            <span class="sub-title">RED SEA MONITOR · VOL. AUTO</span>
            <h1>Rudé moře: bezpečnost & geopolitika</h1>
            <p id="last-updated">Aktualizováno načítání...</p>
        </div>
    </header>

    <main class="container">
        
        <!-- Sekce Trhu s obrázkem tankeru -->
        <section class="card market-card">
            <div class="card-content">
                <h2>§ Trh: ropa a měnový kurz</h2>
                <div class="price-row">
                    <div class="price-box">
                        <span class="price" id="brent-price">--.--</span>
                        <span class="label">BRENT · <span id="brent-date">--</span></span>
                    </div>
                    <div class="price-box" id="czk-box">
                        <span class="price" id="usd-czk-price">--.--</span>
                        <span class="label">USD/CZK</span>
                    </div>
                </div>
            </div>
            <div class="card-media">
                <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80" alt="Ropný tanker">
            </div>
        </section>

        <!-- Sekce Úrovně hrozby -->
        <section class="card threat-card">
            <h2>§ Úroveň hrozby</h2>
            <div class="threat-body">
                <div class="threat-badge-container">
                    <div class="badge" id="threat-badge">--</div>
                </div>
                <div class="threat-info">
                    <p id="security-status">Načítání bezpečnostního přehledu...</p>
                    <div class="sentiment-bar-container">
                        <div class="sentiment-bar" id="sentiment-bar" style="width: 0%;"></div>
                    </div>
                    <span class="sentiment-text">Sentiment napětí: <strong id="sentiment-score">0/100</strong></span>
                </div>
            </div>
            <div class="card-media media-wide">
                <img src="https://images.unsplash.com/photo-1508614589041-895b88991e3e?auto=format&fit=crop&w=900&q=80" alt="Vojenská loď">
            </div>
        </section>

        <!-- Týdenní shrnutí -->
        <section class="card">
            <h2>§ Týdenní shrnutí</h2>
            <p id="weekly-summary">Načítání...</p>
        </section>

        <!-- Investiční doporučení -->
        <section class="card">
            <h2>§ Investiční doporučení</h2>
            <ul id="recommendations-list" class="recommendations">
                <!-- Dynamicky plněno z JS -->
            </ul>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Monitor & Investiční Signály</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 950px; margin: 0 auto; line-height: 1.5; }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        .timestamp { color: #64748b; font-size: 0.85em; margin-bottom: 25px; }
        .ai-box { background: #1e293b; border-left: 4px solid #38bdf8; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
        .badge-threat { display: inline-block; background: #ef4444; color: white; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8em; }
        .section { margin-top: 20px; }
        .section h3 { margin: 0 0 10px 0; color: #94a3b8; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.5px; }
        .section p { margin: 0; color: #cbd5e1; font-size: 0.95em; }
        .recs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 10px; }
        .rec-card { background: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 6px; display: flex; flex-direction: column; justify-content: space-between; }
        .rec-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .rec-sector { font-weight: bold; color: #f8fafc; font-size: 0.95em; }
        .action-tag { font-size: 0.75em; font-weight: bold; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
        .action-koupit { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid #22c55e; }
        .action-prodat { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
        .action-drzet { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; }
        .rec-reason { font-size: 0.85em; color: #94a3b8; margin-top: 5px; }
        .news-card { background: #1e293b; padding: 12px 15px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #334155; }
        .news-card a { color: #f8fafc; text-decoration: none; font-weight: bold; }
        .news-card a:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <h1>AI Monitor: Rudé Moře & Investiční Signály</h1>
    <div class="timestamp" id="last-updated">Načítání dat...</div>

    <div class="ai-box">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin: 0; font-size: 1.2rem;">24h AI Bezpečnostní Analýza</h2>
            <span class="badge-threat" id="threat-level">NAČÍTÁNÍ</span>
        </div>
        
        <div class="section">
            <h3>Bezpečnostní situace</h3>
            <p id="sec-status">-</p>
        </div>

        <div class="section">
            <h3>Sektorová Doporučení (Trading Signals)</h3>
            <div class="recs-grid" id="recs-container"></div>
        </div>

        <div class="section">
            <h3>Krátkodobý výhled</h3>
            <p id="forecast-status">-</p>
        </div>
    </div>

    <h2>Podkladové zprávy (24h)</h2>
    <div id="news-container"></div>

    <script>
        async function init() {
            try {
                const res = await fetch('data.json');
                const data = await res.json();

                document.getElementById('last-updated').innerText = `Poslední AI aktualizace: ${data.last_updated}`;
                document.getElementById('threat-level').innerText = data.assessment.threat_level || 'NEZNÁMÁ';
                document.getElementById('sec-status').innerText = data.assessment.security_status;
                document.getElementById('forecast-status').innerText = data.assessment.forecast;

                const recsContainer = document.getElementById('recs-container');
                recsContainer.innerHTML = '';
                
                data.assessment.recommendations.forEach(rec => {
                    let actionClass = 'action-drzet';
                    if (rec.action.includes('KOUPIT')) actionClass = 'action-koupit';
                    if (rec.action.includes('PRODAT')) actionClass = 'action-prodat';

                    recsContainer.innerHTML += `
                        <div class="rec-card">
                            <div>
                                <div class="rec-header">
                                    <span class="rec-sector">${rec.sector}</span>
                                    <span class="action-tag ${actionClass}">${rec.action}</span>
                                </div>
                                <div class="rec-reason">${rec.reason}</div>
                            </div>
                        </div>
                    `;
                });

                const newsDiv = document.getElementById('news-container');
                newsDiv.innerHTML = '';
                data.articles.forEach(a => {
                    newsDiv.innerHTML += `
                        <div class="news-card">
                            <a href="${a.link}" target="_blank">${a.title}</a>
                            <div style="font-size: 0.8em; color: #64748b; margin-top: 5px;">${a.source} | ${a.published}</div>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Chyba při načítání JSON:", e);
            }
        }
        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitory · přehled</title>
<meta name="description" content="Přehled AI monitorů: Rudé moře, USA, Evropa, Blízký východ, Asie, Japonsko, Česko">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://matesva.github.io/Redsea-monitor/">
<meta name="theme-color" content="#0b1d26">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script data-goatcounter="https://redsea-monitor.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
*{box-sizing:border-box}
:root{--ink:#0b1d26;--ink2:#142c3a;--brass:#b8863b;--text:#e7e0cd;--text-dim:#9aa8ac;--rule:rgba(184,134,59,.35)}
body.light{--ink:#ece6d6;--ink2:#e0d8c0;--text:#1c2b2e;--text-dim:#5c6b6e;--rule:rgba(11,29,38,.18)}
body{margin:0;font-family:'Spectral',Georgia,serif;background-color:var(--ink);background-image:radial-gradient(circle at 1px 1px,rgba(184,134,59,.06) 1px,transparent 0);background-size:22px 22px;color:var(--text);min-height:100vh;padding-bottom:60px}
.wrap{max-width:780px;margin:0 auto;padding:0 20px}
header{border-bottom:3px double var(--brass);padding:28px 0 16px}
.top{font-family:'IBM Plex Mono',monospace;font-size:.72em;letter-spacing:.04em;color:var(--brass);margin-bottom:12px}
h1{font-size:2.1em;margin:0 0 6px;line-height:1.15}
.sub{font-family:'IBM Plex Mono',monospace;font-size:.78em;color:var(--text-dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:24px}
.card{display:block;border:1px solid var(--rule);background:var(--ink2);padding:16px;text-decoration:none;color:var(--text);border-radius:2px;transition:border-color .2s}
.card:hover{border-color:var(--brass)}
.card h2{font-size:1.25em;margin:0 0 6px}
.card p{margin:0 0 14px;color:var(--text-dim);font-size:.9em;line-height:1.5}
.st{font-family:'IBM Plex Mono',monospace;font-size:.72em;color:var(--text-dim);line-height:1.7}
.lvl{font-weight:700;letter-spacing:.03em}
footer{margin-top:34px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.66em;color:var(--text-dim)}
@media (max-width:600px){h1{font-size:1.6em}}
</style>
<link rel="icon" type="image/svg+xml" href="/Redsea-monitor/favicon.svg">
<link rel="apple-touch-icon" href="/Redsea-monitor/icons/apple-touch-icon.png">
<link rel="manifest" href="/Redsea-monitor/app.webmanifest">
<meta property="og:type" content="website">
<meta property="og:locale" content="cs_CZ">
<meta property="og:title" content="Monitory · přehled">
<meta property="og:description" content="Přehled AI monitorů: Rudé moře, USA, Evropa, Blízký východ, Asie, Japonsko, Česko">
<meta property="og:url" content="https://matesva.github.io/Redsea-monitor/">
<meta property="og:image" content="https://matesva.github.io/Redsea-monitor/og.png">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">AI MONITORY · PŘEHLED</div>
    <h1>Přehled monitorů</h1>
    <div class="sub">Automaticky aktualizované AI přehledy zpráv a situace</div>
  </header>
  <div class="grid" id="grid"></div>
  <footer>AKTUALIZOVÁNO AUTOMATICKY · Vždy ověřte v původním zdroji</footer>
</div>
<script>
if(localStorage.getItem('theme')==='light')document.body.classList.add('light');
var BASE="/Redsea-monitor/";
var M=[
 {dir:"redsea/",name:"Rudé moře",desc:"Bezpečnost lodní dopravy, geopolitika, ropa a trhy",data:"data.json",type:"t"},
 {dir:"usa/",name:"USA",desc:"Situace v USA, trhy a investiční dopady",data:"usa/data.json",type:"t"},
 {dir:"europe/",name:"Evropa",desc:"Situace v Evropě, trhy a investiční dopady",data:"europe/data.json",type:"t"},
 {dir:"middle-east/",name:"Blízký východ",desc:"Bezpečnost, ropa a trhy v regionu",data:"middle-east/data.json",type:"t"},
 {dir:"asia/",name:"Čína a Asie",desc:"Politika, ekonomika a bezpečnost v Asii",data:"asia/data.json",type:"t"},
 {dir:"japan/",name:"Japonsko",desc:"Situace v Japonsku, trhy a investiční dopady",data:"japan/data.json",type:"t"},
 {dir:"south-america/",name:"Jižní Amerika",desc:"Politika, ekonomika, měny a komodity v Jižní Americe",data:"south-america/data.json",type:"t"},
 {dir:"czechia/",name:"Česko",desc:"Politika a volby v ČR a Praze: zprávy, strany, sliby, průzkumy",data:"czechia/summary.json",type:"c"}
];
var LV={STABLE:["STABILNÍ","#6a9b6e"],MEDIUM:["STŘEDNÍ","#b8863b"],HIGH:["VYSOKÁ","#c07a3a"],CRITICAL:["KRITICKÁ","#a13d2b"]};
function rel(s){
  if(!s)return"";var f=String(s).replace(" ","T");if(!/Z$|\+/.test(f))f+="Z";
  var d=new Date(f);if(isNaN(d))return"";
  var m=Math.round((Date.now()-d)/6e4);if(m<60)return"před "+Math.max(m,0)+" min";
  var h=Math.round(m/60);if(h<24)return"před "+h+" h";
  return"před "+Math.round(h/24)+" dny";
}
var g=document.getElementById("grid");
g.innerHTML=M.map(function(m,i){
  return '<a class="card" href="'+BASE+m.dir+'"><h2>'+m.name+'</h2><p>'+m.desc+'</p><div class="st" id="st'+i+'">načítání…</div></a>';
}).join("");
M.forEach(function(m,i){
  fetch(BASE+m.data,{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
    var h="";
    if(m.type==="t"){
      var k=String((d.assessment&&d.assessment.threat_level)||"").split(" ")[0].split("/")[0].trim().toUpperCase();
      if(LV[k])h+='Hrozba: <span class="lvl" style="color:'+LV[k][1]+'">'+LV[k][0]+'</span><br>';
      h+="Aktualizováno "+rel(d.last_updated);
    }else{
      h+="Aktualizováno "+rel(d.updated);
    }
    document.getElementById("st"+i).innerHTML=h;
  }).catch(function(){document.getElementById("st"+i).textContent="Otevřít monitor →"});
});
</script>
<script src="/Redsea-monitor/nav.js"></script>
  <script src="/Redsea-monitor/worldmap.js"></script>
</body>
</html>
